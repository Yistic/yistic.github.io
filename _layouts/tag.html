---
layout: default
---
<h1 class="heading">Tag: {{ page.tag | upcase }}</h1>
<hr>
{% assign tagged_posts = site.posts | where_exp: "post", "post.tags contains page.tag" %}
{% if tagged_posts.size == 0 %}
  <p>No posts found.</p>
{% else %}
  {% include post-list.html posts=tagged_posts %}
{% endif %}
