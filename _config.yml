url: "https://yistic.github.io/"
baseurl: ""
lang: en
timezone: "UTC"

title: "Milan Đokić"
tagline: "Systems Programming and Graphics from Scratch"
description: "Long-form notes on C, operating systems, emulation, and graphics written without a graphics library."

favicon: /assets/images/favicon.png
apple_touch_icon: /apple-touch-icon.png
logo: "https://yistic.github.io/assets/images/logo.png"
image: "https://yistic.github.io/assets/images/logo.png"


show_rss: true
show_archive: true

author:
  name: "Milan Đokić"

social:
  - name: "GitHub"
    url: "https://github.com/Yistic"
  - name: "LinkedIn"
    url: "https://www.linkedin.com/in/beli02/"

theme: jekyll-theme-low

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

permalink: /:title/

feed:
  path: rss.xml

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
